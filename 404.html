<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trang không tìm thấy (404) - Trạm Ký Ức</title>
  
  <meta name="description" content="Trang không tìm thấy - Trạm Ký Ức Mẹ Việt Nam Anh Hùng Phường Phước Thới, Cần Thơ." />
  <link rel="icon" type="image/webp" href="assets/images/logo-doan.webp" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-page-wrapper {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1.25rem;
      position: relative;
    }
    .error-card {
      background: #FFFFFF;
      border: 1px solid var(--color-border-gold);
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 560px;
      width: 100%;
      box-shadow: var(--shadow-warm);
      position: relative;
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(3.5rem, 8vw, 5rem);
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--color-primary-dark);
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .error-desc {
      color: var(--color-text-muted);
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }
    .btn-return-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.85rem;
      background: var(--color-primary);
      color: #FFFFFF;
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 600;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(136, 19, 55, 0.3);
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-return-home:hover {
      background: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(136, 19, 55, 0.45);
    }
    .error-lotus {
      width: 64px;
      height: 64px;
      margin-bottom: 1.25rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="error-page-wrapper">
    <div class="error-card">
      <img src="assets/images/lotus.webp" alt="Biểu tượng Hoa sen" class="error-lotus" />
      <div class="error-code">404</div>
      <h1 class="error-title">Trang không tìm thấy</h1>
      <p class="error-desc">
        Địa chỉ bạn đang tìm kiếm không tồn tại hoặc đã được sắp xếp lại. 
        Kính mời quý bạn đọc trở về không gian tưởng niệm và tra cứu thông tin các Mẹ.
      </p>
      <a href="index.html" class="btn-return-home">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Trở về trang chủ Trạm Ký Ức
      </a>
    </div>
  </div>
</body>
</html>
